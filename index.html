<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статус Стримов</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --item-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --live-color: #22c55e;
      --offline-color: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .connection-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--offline-color);
      transition: background-color 0.3s ease;
    }

    .dot.connected {
      background-color: var(--live-color);
      box-shadow: 0 0 8px var(--live-color);
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .platform {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.1rem;
      background-color: var(--item-bg);
      border-radius: 0.75rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .platform:hover {
      transform: translateY(-1px);
    }

    .platform-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }

    .badge.offline {
      background-color: #475569;
      color: var(--text-muted);
    }

    .badge.live {
      background-color: var(--live-color);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Статус стримов</h1>
    <div class="connection-status">
      <div id="conn-dot" class="dot"></div>
      <span id="conn-text">Подключение...</span>
    </div>
  </div>

  <div class="status-list">
    <div class="platform">
      <span class="platform-name">Twitch</span>
      <span id="twitch-status" class="badge offline">OFFLINE</span>
    </div>
    <div class="platform">
      <span class="platform-name">YouTube</span>
      <span id="youtube-status" class="badge offline">OFFLINE</span>
    </div>
    <div class="platform">
      <span class="platform-name">VK Video</span>
      <span id="vk-status" class="badge offline">OFFLINE</span>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://stream-links-backend-1061508657324.europe-west1.run.app";

  const connDot = document.getElementById("conn-dot");
  const connText = document.getElementById("conn-text");

  // 1. Получение начального состояния при загрузке
  async function fetchInitialStatus() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/status`);
      if (res.ok) {
        const data = await res.json();
        updateUI(data);
      }
    } catch (err) {
      console.error("Ошибка при получении начального статуса:", err);
    }
  }

  // 2. Подключение к SSE в реальном времени
  function initSSE() {
    const eventSource = new EventSource(`${BACKEND_URL}/api/stream-events`);

    eventSource.onopen = () => {
      connDot.className = "dot connected";
      connText.textContent = "Онлайн";
    };

    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        updateUI(data);
      } catch (err) {
        console.error("Ошибка разбора SSE сообщения:", err);
      }
    };

    eventSource.onerror = (err) => {
      console.error("Ошибка SSE соединения:", err);
      connDot.className = "dot";
      connText.textContent = "Переподключение...";
    };
  }

  function updateUI(data) {
    if (data.twitch !== undefined) updateBadge("twitch", data.twitch);
    if (data.youtube !== undefined) updateBadge("youtube", data.youtube);
    if (data.vk !== undefined) updateBadge("vk", data.vk);
  }

  function updateBadge(platform, isLive) {
    const el = document.getElementById(`${platform}-status`);
    if (!el) return;

    if (isLive) {
      el.textContent = "LIVE";
      el.className = "badge live";
    } else {
      el.textContent = "OFFLINE";
      el.className = "badge offline";
    }
  }

  // Инициализация
  fetchInitialStatus();
  initSSE();
</script>
</body>
</html>
